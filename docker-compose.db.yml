name: busca-db

services:
  postgres:
    image: postgres:16
    container_name: busca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: busca
      POSTGRES_PASSWORD: busca
      POSTGRES_DB: busca
    ports:
      - "15432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busca -d busca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: busca-recursiva-pratica_pgdata
