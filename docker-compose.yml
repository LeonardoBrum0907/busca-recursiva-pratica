name: busca-ingenua

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: busca_api_ingenua
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Busca__Modo: ingenua
      ConnectionStrings__Postgres: Host=host.docker.internal;Port=15432;Database=busca;Username=busca;Password=busca
    ports:
      - "5080:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: busca_web_ingenua
    ports:
      - "5173:80"
    volumes:
      - ./web/public/documentos/volume:/usr/share/nginx/html/documentos/volume:ro
    depends_on:
      - api
